# Describe el prototipo existente; no es una lista de funcionalidades por implementar.
app:
  nombre: AgendaTenis
  plataforma: Android nativo
  lenguaje: Kotlin
  interfaz: Jetpack Compose y Material 3
  navegacion: Navigation Compose con NavHost y NavController
  sdk: {minimo: 33, objetivo: 37, compilacion: 37}
  proposito: Organizar jugadores, planes, horarios, canchas y registros de pagos.
  almacenamiento: Singleton AgendaTenisRepository con StateFlow en memoria y datos de demostracion.
  persistencia_entre_procesos: false
  ui:
    temas: [claro, oscuro]
    colores: Verde primario, fondos neutros, amarillo para acciones destacadas y rojo para acciones destructivas.
    componentes: [avatar con iniciales, buscadores, FAB, dias de semana, banner de pago, campana y dialogos de confirmacion]

roles:
  ADMIN: Administracion global de coaches, jugadores, catalogos y planes.
  COACH: Actividad propia y consulta de canchas; el coach principal tiene vistas de supervision adicionales.
  registro_publico: Crea una cuenta COACH y abre su pantalla principal.
  coach_principal:
    criterio_existente: 'Usuario.esCoachPrincipal: rol COACH y (id user_coach_1 o nombre que contenga Jorge sin distinguir mayusculas).'
    usuario_demostracion: Jorge Sanmartin
    capacidades_existentes: [ver coaches, consultar canchas y horarios asignados, crear y editar horarios de otros coaches, eliminar horarios, consultar jugadores y reasignar coach]
  limite: Los filtros y accesos de rol pertenecen al prototipo cliente; no existe autorizacion de servidor.

navegacion:
  comun: Splash -> Login <-> Registro -> principal segun rol
  coach:
    bottom_nav: [Inicio, Jugadores, Agenda, Planes, Ajustes]
    bottom_nav_principal: [Inicio, Coaches, Jugadores, Agenda, Planes, Ajustes]
    coaches:
      visibilidad: Solo cuando usuarioActual.esCoachPrincipal es verdadero.
      icono: Icons.Default.SupervisorAccount
      componente: NavigationBarItem dentro de la misma NavigationBar.
      pantalla_reutilizada: GestionCoachesPrincipalScreen
      contenido_compartido: gestionCoachesContent en AppRoot enlaza los mismos formularios y detalle de jugador.
      volver_desde_pestana: Selecciona Inicio.
      accesos_previos_conservados: [tarjeta de gestion en Inicio, acceso de gestion en Agenda]
      ruta_previa: gestion_coaches_principal
      volver_desde_ruta_previa: popBackStack
    inicio: Pagos proximos o vencidos, clases de hoy, dialogo de recordatorios y acceso al detalle o registro de pago.
    jugadores: Lista con busqueda, detalle, alta y edicion; supervision y reasignacion para coach principal.
    agenda: Horarios agrupados por dia, formularios y consulta de canchas; filtro por coach para principal.
    planes: Lista, creacion, edicion y eliminacion con validacion de jugadores activos asociados.
    ajustes: Tema, recordar sesion, dias de anticipacion y cierre de sesion.
  admin:
    bottom_nav: [Inicio, Coaches, Jugadores, Catalogos, Ajustes]
    inicio: Resumen global de coaches, jugadores y pagos proximos.
    coaches: Lista, creacion y edicion de cuentas con estado activo o inactivo.
    jugadores: Lista global y detalle; reutiliza los formularios existentes.
    catalogos: Ciudades y canchas con formularios en dialogos, y planes globales.
    ajustes: Tema y cierre de sesion.
  subpantallas: [detalle_jugador, form_jugador, form_pago, form_plan, form_horario, canchas_coach, gestion_coaches_principal, admin_form_coach]
  nota: Navigation.kt tambien conserva el modelo Screen; AppRoot utiliza las rutas de Routes y NavController.

entidades:
  Usuario: [id, nombre, correo, contrasena, rol, estado]
  Ciudad: [id, nombre]
  Cancha: [id, nombre, referencia, ciudadId]
  Plan: [id, nombre, clasesPorSemana, valor, coachId]
  Jugador: [id, nombre, telefono, fechaInicio, planId, coachId, estado]
  Horario: [id, coachId, canchaId, diaSemana, horaInicio, horaFin]
  Asignacion: [id, jugadorId, horarioId]
  Pago: [id, jugadorId, fecha, monto, observacion]
  ConfigUsuario: [usuarioId, tema, recordarSesion, diasAnticipacion]
  derivados: [PagoCalculado, RecordatorioItem, ClaseHoyItem, AdminResumen, ResumenCoachGestion]

comportamiento_existente:
  autenticacion:
    - Credenciales y usuarios de demostracion en memoria; no existe autenticacion remota.
    - Correo unico, campos obligatorios y contrasena de al menos 6 caracteres con confirmacion en el registro.
    - Un usuario inactivo no puede iniciar sesion.
    - Cerrar sesion borra usuarioActual; recordarSesion se conserva solo en memoria.
  pagos:
    - Registra pagos; no procesa cobros ni usa pasarelas.
    - Ancla en el primer pago cronologico o fechaInicio si no hay pagos.
    - Proxima fecha igual al ancla mas la cantidad de pagos en meses, usando LocalDate.plusMonths.
    - El monto debe ser positivo y se precarga desde el plan en el formulario.
    - Permite consultar, editar y eliminar pagos y recalcula el estado.
    - Recordatorios calculados y mostrados dentro de la app, incluidos pagos vencidos y proximos.
  jugadores_y_horarios:
    - Un jugador tiene un plan y un coach, y asignaciones a horarios.
    - Diferencias entre dias asignados y clases del plan muestran advertencia en el formulario.
    - Rechaza horarios solapados del mismo coach y dia; permite coincidencias de otros coaches en la cancha.
    - No elimina planes con jugadores activos, ciudades con canchas ni canchas con horarios.
    - Eliminar un jugador con pagos lo inactiva y elimina sus asignaciones; sin pagos lo borra.
    - Reasignar un jugador cambia su coach y conserva las asignaciones existentes.
  configuracion: Tema reactivo, recordarSesion y anticipacion limitada a 1 a 7 dias con valor inicial de 3.

estado_academico:
  etapa_actual: Prototipo de frontend y navegacion.
  presentes: [Splash, registro e inicio de sesion de demostracion, configuracion visual, formularios CRUD en memoria, Compose, Material 3, Navigation Compose]
  pendientes_en_codigo:
    - Persistencia con Room y arquitectura MVVM con ViewModel.
    - DataStore para preferencias y sesion persistente.
    - Registro y autenticacion respaldados por base de datos.
    - Notificaciones del sistema y reprogramacion persistente; el manifest no declara POST_NOTIFICATIONS ni receptor de reinicio.
  nota: Los pendientes se documentan sin implementarlos en este ajuste puntual de navegacion.

