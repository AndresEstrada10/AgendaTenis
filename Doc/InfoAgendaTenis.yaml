# Estado verificado contra el codigo fuente el 2026-11-22.
# Describe el sistema existente tras la implementacion de la Etapa 3: Arquitectura MVVM, sincronizacion global del tema, valores individuales y recordatorios automaticos por correo.
app:
  nombre: AgendaTenis
  plataforma: Android nativo
  lenguaje: Kotlin
  arquitectura: MVVM (Model-View-ViewModel) con MAD Skills, Coroutines, StateFlow, DataStore Preferences y DI limpia
  interfaz: Jetpack Compose y Material 3 con State Hoisting estricto
  navegacion: Navigation Compose con NavHost y NavController
  sdk: {minimo: 33, objetivo: 37, compilacion: 37}
  proposito: Organizar jugadores con cuota mensual individual, horarios, canchas, registros de pagos y recordatorios automaticos por correo.
  almacenamiento: Single Source of Truth (SSOT) con InMemoryAgendaTenisDataSource y StateFlow reactivos; persistencia global de apariencia con DataStoreThemeRepository; retardos asincronos simulados (delay) y operaciones en Dispatchers.IO; esquema y backend en Supabase.
  persistencia_entre_procesos: Backend en Supabase PostgreSQL con ejecucion de tareas mediante Supabase Cron y Resend.
  ui:
    temas: [claro, oscuro, sistema]
    colores: Verde primario, fondos neutros, amarillo para acciones destacadas y rojo para acciones destructivas.
    componentes: [avatar con iniciales, buscadores, FAB, dias de semana, banner de pago, campana con contador, dialogos de confirmacion, selector de tema global]
    consumo_estado: collectAsStateWithLifecycle() en todas las pantallas.

roles:
  ADMIN: Administracion global de coaches, jugadores (creacion, edicion y cuota individual) y catalogos de ciudades y canchas.
  COACH: Actividad propia, gestion de jugadores y consulta de canchas; el coach principal tiene vistas de supervision adicionales.
  registro_publico: Crea una cuenta COACH y abre su pantalla principal.
  coach_principal:
    criterio_existente: 'Usuario.esCoachPrincipal: rol COACH y (id user_coach_1 o nombre que contenga Jorge sin distinguir mayusculas).'
    usuario_demostracion: Jorge Sanmartin
    capacidades_existentes: [ver coaches, consultar canchas y horarios asignados, crear y editar horarios de otros coaches, eliminar horarios, consultar jugadores y reasignar coach]
  limite: Los filtros y accesos de rol se respetan tanto en cliente como en los servicios de backend.

navegacion:
  comun: Splash -> Login <-> Registro -> principal segun rol
  coach:
    bottom_nav: [Inicio, Jugadores, Agenda, Ajustes]
    bottom_nav_principal: [Inicio, Coaches, Jugadores, Agenda, Ajustes]
    coaches:
      visibilidad: Solo cuando usuarioActual.esCoachPrincipal es verdadero.
      icono: Icons.Default.SupervisorAccount
      componente: NavigationBarItem dentro de la misma NavigationBar.
      pantalla_reutilizada: GestionCoachesPrincipalScreen
      contenido_compartido: gestionCoachesContent en AppRoot enlaza los mismos formularios y detalle de jugador.
      volver_desde_pestana: Selecciona Inicio.
      accesos_previos_conservados: [tarjeta de gestion en Inicio, acceso de gestion en Agenda]
      ruta_previa: gestion_coaches_principal
      volver_desde_ruta_previa: popBackStack
    inicio: Pagos proximos o vencidos con cuota individual, clases de hoy, dialogo de recordatorios y acceso al detalle o registro de pago.
    jugadores: Lista con busqueda, detalle, alta y edicion de cuota individual y correo; supervision y reasignacion para coach principal.
    agenda: Horarios agrupados por dia, formularios y consulta de canchas; filtro por coach para principal.
    ajustes: Tema global persistente, recordar sesion, dias de anticipacion (1-7 dias) y cierre de sesion.
  admin:
    bottom_nav: [Inicio, Coaches, Jugadores, Catalogos, Ajustes]
    inicio: Resumen global de coaches, jugadores y pagos proximos.
    coaches: Lista, creacion y edicion de cuentas con estado activo o inactivo.
    jugadores: Lista global, creacion y edicion de jugadores con correo y cuota mensual individual; reasignacion de coach.
    catalogos: Ciudades y canchas con formularios en dialogos interactivos.
    ajustes: Tema global persistente y cierre de sesion.
  subpantallas: [detalle_jugador, form_jugador, form_pago, form_horario, canchas_coach, gestion_coaches_principal, admin_form_coach]
  nota: Eliminado el concepto de Planes y sus subpantallas (form_plan, PlanesListScreen).

entidades:
  Usuario: [id, nombre, correo, contrasena, rol, estado]
  Ciudad: [id, nombre]
  Cancha: [id, nombre, referencia, ciudadId]
  Jugador: [id, nombre, telefono, correo, fechaInicio, valorMensual, coachId, estado]
  Horario: [id, coachId, canchaId, diaSemana, horaInicio, horaFin]
  Asignacion: [id, jugadorId, horarioId]
  Pago: [id, jugadorId, fecha, monto, observacion]
  ConfigUsuario: [usuarioId, tema, recordarSesion, diasAnticipacion]
  derivados: [PagoCalculado, RecordatorioItem, ClaseHoyItem, AdminResumen, ResumenCoachGestion]
  backend_envios: [recordatorios_envios: id, jugador_id, tipo_recordatorio, ciclo_fecha_pago, correo_destinatario, valor_mensual, asunto, mensaje, estado, proveedor, proveedor_id, error_mensaje, intentos, creado_en, enviado_en]

arquitectura_mvvm_etapa_3:
  paquetes:
    data:
      datasource:
        - AgendaTenisDataSource (interfaz contract de SSOT y flujos StateFlow)
        - InMemoryAgendaTenisDataSource (implementacion en memoria con delay simulado y Dispatchers.IO)
      repository:
        - IAgendaTenisRepository (interfaz que desacopla la UI de las fuentes de datos)
        - AgendaTenisRepositoryImpl (implementacion de logica de negocio y Dispatchers.IO)
        - ThemeRepository (contrato para persistencia global de apariencia)
        - DataStoreThemeRepository (persistencia reactiva del tema en DataStore Preferences)
    di:
      - AppContainer / DefaultAppContainer (inyeccion manual estructurada de dependencias con getThemeRepository)
      - ViewModelFactory (ViewModelProvider.Factory para instanciar todos los ViewModels desacoplados)
    ui:
      screens:
        - auth: LoginScreen, RegistroScreen, SplashScreen
        - coach: CoachHomeScreen, JugadoresListScreen, AgendaCoachScreen, ConfiguracionCoachScreen, GestionCoachesPrincipalScreen, DetalleJugadorScreen, FormJugadorScreen, FormPagoScreen, FormHorarioScreen, CanchasCoachScreen
        - admin: AdminHomeScreen, AdminCoachesScreen, AdminJugadoresScreen, AdminCatalogosScreen, AdminConfiguracionScreen, AdminFormCoachScreen
      viewmodel:
        - auth: AuthViewModel
        - coach: CoachHomeViewModel, JugadoresViewModel, AgendaCoachViewModel, ConfiguracionCoachViewModel, GestionCoachesPrincipalViewModel, DetalleJugadorViewModel, FormJugadorViewModel, FormPagoViewModel, FormHorarioViewModel, CanchasCoachViewModel
        - admin: AdminHomeViewModel, AdminCoachesViewModel, AdminJugadoresViewModel, AdminCatalogosViewModel, AdminConfiguracionViewModel, AdminFormCoachViewModel
        - theme: ThemeViewModel (gestion del estado reactivo del tema global)
      components:
        - SelectorTema (selector unificado para Claro, Oscuro o Sistema)
      state_hoisting: Estricto. Ningun composable hijo recibe instancias de ViewModel; solo reciben UiState y lambdas () -> Unit o (T) -> Unit.
      ciclo_de_vida: Consumo reactivo seguro mediante collectAsStateWithLifecycle().
    legacy_support:
      - AgendaTenisRepository facade (Singleton compatible que delega en IAgendaTenisRepository via DefaultAppContainer).

comportamiento_existente:
  autenticacion:
    - Credenciales y usuarios de demostracion en memoria; compatible con supabase auth.
    - Correo unico, campos obligatorios y contrasena de al menos 6 caracteres con confirmacion en el registro.
    - Un usuario inactivo no puede iniciar sesion.
    - Cerrar sesion borra usuarioActual; recordarSesion se conserva en memoria y preferencias.
  pagos_y_valores_individuales:
    - Planes eliminados del sistema: cada jugador tiene su cuota mensual individual fijada de manera personalizada e independiente de su nivel.
    - Tanto el usuario COACH como el ADMIN pueden establecer y modificar el valor mensual y correo del jugador.
    - El formulario de registro de pago precarga como sugerencia la cuota mensual individual del jugador.
    - Ancla en el primer pago cronologico o fechaInicio si no hay pagos.
    - Proxima fecha igual al ancla mas la cantidad de pagos en meses, usando LocalDate.plusMonths.
    - Permite consultar, editar y eliminar pagos y recalcula el estado de vencimiento.
    - Recordatorios internos calculados y mostrados dentro de la app (campana y tarjetas), reflejando la cuota individual.
  recordatorios_automaticos_por_correo:
    - Revision diaria automatizada con Supabase Cron a las 08:00 AM hora America/Guayaquil (13:00 UTC), funcionando incluso con la app cerrada.
    - Supabase Edge Function (enviar-recordatorios) en TypeScript/Deno calcula los ciclos y procesa los envios mediante Resend.
    - Dos disparadores por ciclo: cuando se aproxima la fecha de pago (1-7 dias, def 3) y cuando llega el mismo dia de vencimiento.
    - Correos transaccionales enriquecidos con nombre del jugador, motivo del recordatorio, fecha de vencimiento y cuota mensual individual.
    - Idempotencia y prevencion estricta de duplicados mediante la tabla recordatorios_envios y restriccion UNIQUE(jugador_id, ciclo_fecha_pago, tipo_recordatorio).
    - Estado de envio condicionado a confirmacion efectiva del proveedor Resend (HTTP 200/201 + ID retornado); no se marca como enviado en caso de fallo.
  jugadores_y_horarios:
    - Un jugador tiene correo, cuota individual, coach asignado y asignaciones a horarios.
    - Rechaza horarios solapados del mismo coach y dia; permite coincidencias de otros coaches en la cancha.
    - No elimina ciudades con canchas ni canchas con horarios.
    - Eliminar un jugador con pagos lo inactiva y elimina sus asignaciones para preservar su historial; sin pagos lo borra definitivamente.
    - Reasignar un jugador cambia su coach y conserva las asignaciones existentes.
  configuracion: Tema reactivo y global persistente con DataStore Preferences, recordarSesion y anticipacion de recordatorios limitada a 1 a 7 dias con valor inicial de 3.

verificacion:
  compilacion: ':app:assembleDebug completado exitosamente.'
  pruebas: ':app:testDebugUnitTest completado exitosamente con 19 pruebas (12 de reglas de negocio + 1 default + 4 de arquitectura MVVM y ViewModels + 2 de persistencia de tema) al 100% aprobadas.'
  cobertura_arquitectura:
    - Flujo UI (Compose) -> ViewModel -> Repository -> DataSource verificado y conectado.
    - Single Source of Truth (SSOT) garantizado mediante StateFlow y DataStore Preferences.
    - Dispatchers.IO en todas las operaciones asincronas de lectura/escritura con delays simulados de 40ms.
    - DI estructurada con AppContainer y ViewModelFactory sin acoplamiento.
